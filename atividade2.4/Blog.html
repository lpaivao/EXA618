<html>
  <head>
    <title>My Blog</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <script type="application/javascript">
      const url =
        "https://script.google.com/macros/s/AKfycbwdBQtaPsXIQyeD4cL74XU_pNCH-LWvsWECvJm0sSsk-GUXtF5w7ZWR9RUnfIPb0hZd/exec";

      async function loadMessages() {
        try {
          const response = await fetch(url);
          const data = await response.json();
          const display = document.getElementById("messages");

          display.innerHTML = "";

          data.forEach(function (item) {
            const p = document.createElement("p");
            p.innerHTML = "<strong>" + item[1] + ":</strong> " + item[0];
            display.appendChild(p);
          });
        } catch (error) {
          console.error("Erro ao carregar mensagens:", error);
        }
      }

      function send() {
        const data = {
          mensagem: document.getElementById("msg").value,
          autor: document.getElementById("autor").value,
        };

        fetch(url, {
          method: "POST",
          body: JSON.stringify(data),
          mode: "no-cors",
        }).then(() => {
          // Limpa o campo de texto
          document.getElementById("msg").value = "";
          setTimeout(loadMessages, 1000);
        });
      }

      window.onload = loadMessages;
    </script>
  </head>
  <body>
    <h1 align="center">Mensagem:</h1>
    <hr />
    <br />
    <form onsubmit="return false;">
      <label>Mensagem:</label>
      <input type="text" size="64" name="msg" id="msg" /><br /><br />
      <label>Autor:</label>
      <input type="text" size="64" name="autor" id="autor" />
      <br /><br />
      <button type="button" onclick="send()">Enviar</button>
    </form>
    <hr />
    <h2>Mensagens:</h2>
    <div id="messages">Carregando mensagens...</div>
  </body>
</html>
